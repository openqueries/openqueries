<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Queries store screenshot frame</title>
    <style>
      :root {
        color: #111113;
        background: #ececf0;
        font-family:
          Inter,
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 1280px;
        height: 800px;
        margin: 0;
        overflow: hidden;
      }
      body {
        padding: 22px;
        background:
          radial-gradient(circle at 15% 5%, #fff 0, transparent 32%), #ececf0;
      }
      .browser {
        width: 100%;
        height: 100%;
        overflow: hidden;
        border: 1px solid #d4d4da;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 24px 70px rgba(22, 22, 28, 0.16);
      }
      .chrome {
        height: 58px;
        padding: 0 18px;
        border-bottom: 1px solid #dedee3;
        display: flex;
        align-items: center;
        gap: 15px;
        background: #f7f7f8;
      }
      .dots {
        display: flex;
        gap: 7px;
      }
      .dots i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #d3d3d8;
      }
      .address {
        width: 540px;
        height: 34px;
        margin: auto;
        border: 1px solid #dedee3;
        border-radius: 17px;
        display: grid;
        place-items: center;
        color: #72727b;
        background: #fff;
        font-size: 12px;
      }
      .workspace {
        height: calc(100% - 58px);
        display: grid;
        grid-template-columns: minmax(0, 1fr) 440px;
      }
      .context {
        position: relative;
        padding: 52px 70px;
        overflow: hidden;
        background: #fbfbfc;
      }
      .provider {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #696972;
        font-size: 12px;
        font-weight: 650;
      }
      .provider-mark {
        width: 28px;
        height: 28px;
        border: 1px solid #dddde2;
        border-radius: 8px;
        display: grid;
        place-items: center;
        background: #fff;
      }
      .provider-mark svg {
        width: 17px;
        height: 17px;
      }
      .provider-mark .claude-logo {
        width: 17px;
        height: 17px;
        display: block;
        background: #d97757;
        -webkit-mask: url("/node_modules/.pnpm/simple-icons@16.28.0/node_modules/simple-icons/icons/claude.svg")
          center / contain no-repeat;
        mask: url("/node_modules/.pnpm/simple-icons@16.28.0/node_modules/simple-icons/icons/claude.svg")
          center / contain no-repeat;
      }
      h1 {
        max-width: 590px;
        margin: 88px 0 22px;
        font-size: 42px;
        line-height: 1.08;
        letter-spacing: -0.05em;
      }
      .seed {
        max-width: 590px;
        margin: 0;
        color: #5c5c65;
        font-size: 17px;
        line-height: 1.55;
      }
      .tool-call {
        max-width: 590px;
        margin-top: 34px;
        padding: 16px 18px;
        border: 1px solid #dddde2;
        border-radius: 12px;
        display: flex;
        align-items: center;
        gap: 13px;
        background: #fff;
        box-shadow: 0 4px 20px rgba(30, 30, 36, 0.04);
      }
      .pulse {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        color: #fff;
        background: #111113;
        font-weight: 700;
      }
      .tool-call strong,
      .tool-call span {
        display: block;
      }
      .tool-call strong {
        margin-bottom: 3px;
        font-size: 12px;
      }
      .tool-call span {
        color: #777780;
        font-size: 11px;
      }
      .caption {
        position: absolute;
        left: 70px;
        bottom: 48px;
        color: #5b4de8;
        font:
          650 10px/1 ui-monospace,
          SFMono-Regular,
          monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      iframe {
        width: 440px;
        height: 100%;
        border: 0;
        border-left: 1px solid #d9d9df;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div class="browser">
      <div class="chrome">
        <span class="dots"><i></i><i></i><i></i></span>
        <div class="address" id="address">chatgpt.com</div>
      </div>
      <div class="workspace">
        <section class="context">
          <div class="provider">
            <span class="provider-mark" id="provider-mark"></span>
            <span id="provider-name">ChatGPT Search</span>
          </div>
          <h1 id="headline">The retrieval trace, beside the answer.</h1>
          <p class="seed" id="seed">
            Compare open-source analytics platforms for a privacy-first SaaS
            team.
          </p>
          <div class="tool-call">
            <span class="pulse">↗</span>
            <div>
              <strong id="tool-title">Searching the web</strong>
              <span id="tool-query">open source product analytics tools</span>
            </div>
          </div>
          <span class="caption" id="caption">Actual production side panel</span>
        </section>
        <iframe
          id="sidepanel-frame"
          title="Open Queries production side panel"
          src="about:blank"
        ></iframe>
      </div>
    </div>
    <script>
      const OPENAI = `<svg viewBox="0 0 20 20" fill="currentColor" aria-label="OpenAI"><path d="M11.248 18.25q-.825 0-1.568-.314a4.3 4.3 0 0 1-1.32-.874 4 4 0 0 1-1.304.214 4 4 0 0 1-2.046-.544 4.27 4.27 0 0 1-1.518-1.485 4 4 0 0 1-.56-2.095q0-.48.131-1.04A4.4 4.4 0 0 1 2.04 10.71a4.07 4.07 0 0 1 .017-3.4 4.2 4.2 0 0 1 1.056-1.418 3.8 3.8 0 0 1 1.6-.842 3.9 3.9 0 0 1 .76-1.683q.593-.759 1.451-1.188a4.04 4.04 0 0 1 1.832-.429q.825 0 1.567.313.742.314 1.32.875a4 4 0 0 1 1.304-.215q1.106 0 2.046.545a4.14 4.14 0 0 1 1.501 1.485q.578.941.578 2.095 0 .48-.132 1.04.66.61 1.023 1.419.363.792.363 1.666 0 .892-.38 1.717a4.3 4.3 0 0 1-1.072 1.435 3.8 3.8 0 0 1-1.584.825 3.8 3.8 0 0 1-.775 1.683 4.06 4.06 0 0 1-1.436 1.188 4.04 4.04 0 0 1-1.832.429m-4.076-2.062q.825 0 1.435-.347l3.103-1.782a.36.36 0 0 0 .164-.313v-1.42L7.881 14.62a.67.67 0 0 1-.726 0l-3.118-1.798a.5.5 0 0 1-.017.115v.198q0 .841.396 1.551.413.693 1.139 1.089a3.2 3.2 0 0 0 1.617.412m.165-2.69a.4.4 0 0 0 .181.05q.083 0 .165-.05l1.238-.71-3.977-2.31a.7.7 0 0 1-.363-.643v-3.58q-.825.362-1.32 1.122a2.9 2.9 0 0 0-.495 1.65q0 .809.413 1.55.412.743 1.072 1.123zm3.91 3.663q.875 0 1.585-.396a2.96 2.96 0 0 0 1.534-2.64v-3.564a.32.32 0 0 0-.165-.297l-1.254-.726v4.604a.7.7 0 0 1-.363.643l-3.119 1.799a3 3 0 0 0 1.783.577m.627-6.039V8.878L10.01 7.822 8.129 8.878v2.244l1.881 1.056zM7.057 5.859a.7.7 0 0 1 .363-.644l3.119-1.798a3 3 0 0 0-1.782-.578q-.874 0-1.584.396A2.96 2.96 0 0 0 6.05 4.324a3.07 3.07 0 0 0-.396 1.551v3.547q0 .199.165.314l1.237.726zm8.383 7.887q.825-.364 1.303-1.123.495-.758.495-1.65a3.15 3.15 0 0 0-.412-1.55q-.413-.743-1.073-1.123l-3.086-1.782q-.099-.065-.181-.049a.3.3 0 0 0-.165.05l-1.238.692 3.993 2.327a.6.6 0 0 1 .264.264.64.64 0 0 1 .1.363zm-3.317-8.382a.63.63 0 0 1 .726 0l3.135 1.831v-.297q0-.792-.396-1.501a2.86 2.86 0 0 0-1.105-1.155q-.71-.43-1.65-.43-.825 0-1.436.347L8.294 5.941a.36.36 0 0 0-.165.314v1.418z"/></svg>`;
      const GOOGLE = `<svg viewBox="0 0 18 18" aria-label="Google"><path fill="#4285F4" d="M17.64 9.205c0-.638-.057-1.252-.164-1.841H9v3.482h4.844a4.14 4.14 0 0 1-1.797 2.715v2.258h2.909c1.702-1.567 2.684-3.878 2.684-6.614Z"/><path fill="#34A853" d="M9 18c2.43 0 4.468-.806 5.956-2.181l-2.909-2.258c-.806.54-1.835.859-3.047.859-2.344 0-4.328-1.585-5.037-3.714H.956v2.332A9 9 0 0 0 9 18Z"/><path fill="#FBBC05" d="M3.963 10.706A5.4 5.4 0 0 1 3.682 9c0-.592.102-1.167.281-1.706V4.962H.956A9 9 0 0 0 0 9c0 1.452.347 2.827.956 4.038l3.007-2.332Z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.507.454 3.441 1.345l2.581-2.581C13.464.892 11.426 0 9 0A9 9 0 0 0 .956 4.962l3.007 2.332C4.672 5.165 6.656 3.58 9 3.58Z"/></svg>`;
      const params = new URLSearchParams(location.search);
      const provider = params.get("provider") || "chatgpt";
      const copy = {
        chatgpt: {
          address: "chatgpt.com",
          name: "ChatGPT Search",
          logo: OPENAI,
          query: "open source product analytics tools",
        },
        claude: {
          address: "claude.ai",
          name: "Claude web search",
          logo: `<span class="claude-logo" role="img" aria-label="Claude"></span>`,
          query: "privacy focused analytics platforms comparison",
        },
        google: {
          address: "google.com/search",
          name: "Google AI Overviews",
          logo: GOOGLE,
          query: "best open source analytics platforms",
        },
      }[provider];
      document.querySelector("#address").textContent = copy.address;
      document.querySelector("#provider-name").textContent = copy.name;
      document.querySelector("#provider-mark").innerHTML = copy.logo;
      document.querySelector("#tool-query").textContent = copy.query;
      document.querySelector("#sidepanel-frame").src =
        `http://127.0.0.1:4176/sidepanel.html?screen=${encodeURIComponent(params.get("screen") || "trace")}`;
      if (params.get("screen") === "settings") {
        document.querySelector("#headline").textContent =
          "Local by default. Contribution by choice.";
        document.querySelector("#seed").textContent =
          "The query trace stays in Chrome unless you enable the separate contribution control.";
        document.querySelector("#caption").textContent =
          "Queries, not conversations";
      }
    </script>
  </body>
</html>
